name: "Setup Playwright Browsers"
description: "Cross-platform Playwright browser binary cache and provisioning composite action"
inputs:
  cache:
    description: "Enable ~/.cache/ms-playwright caching"
    required: false
    default: "true"
  install-deps:
    description: "Run playwright install --with-deps"
    required: false
    default: "true"
  browser:
    description: "Browser to install (chromium, firefox, webkit, or all)"
    required: false
    default: "chromium"

runs:
  using: "composite"
  steps:
    - name: Cache Playwright Browsers
      id: playwright-cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      env:
        NODE_NO_WARNINGS: "1"
        NODE_OPTIONS: "--no-deprecation"
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.browser }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ inputs.browser }}-
          ${{ runner.os }}-playwright-

    - name: Provision Playwright Browsers & OS Dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      env:
        NODE_NO_WARNINGS: "1"
        NODE_OPTIONS: "--no-deprecation"
        DEBIAN_FRONTEND: "noninteractive"
        NEEDRESTART_MODE: "a"
      run: |
        if [ "${{ inputs.browser }}" = "all" ] || [ -z "${{ inputs.browser }}" ]; then
          bunx playwright install --with-deps
        else
          bunx playwright install --with-deps "${{ inputs.browser }}"
        fi
