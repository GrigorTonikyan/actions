name: "Setup Playwright Browsers"
description: "Ultra-fast Playwright browser and runtime environment provisioning with official container detection"
inputs:
  cache:
    description: "Enable ~/.cache/ms-playwright caching"
    required: false
    default: "true"
  install-deps:
    description: "Provision operating system dependencies when missing"
    required: false
    default: "true"
  browser:
    description: "Browser to install (chromium, firefox, webkit, or all)"
    required: false
    default: "chromium"
  only-shell:
    description: "Only install headless shell when installing Chromium (~50 MB vs ~272 MB)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Resolve Playwright Version
      id: playwright-version
      shell: bash
      run: |
        PW_VERSION=""
        if command -v bunx >/dev/null 2>&1; then
          PW_VERSION=$(bunx playwright --version 2>/dev/null | awk '{print $2}' || true)
        elif command -v npx >/dev/null 2>&1; then
          PW_VERSION=$(npx playwright --version 2>/dev/null | awk '{print $2}' || true)
        fi

        if [ -z "$PW_VERSION" ] && [ -f "package.json" ]; then
          PW_VERSION=$(grep -E '"(@playwright/test|playwright)":' package.json | head -n1 | sed -E 's/.*"[\^~]?([0-9]+\.[0-9]+\.[0-9]+)".*/\1/' || true)
        fi

        if [ -z "$PW_VERSION" ]; then
          PW_VERSION="1.65.0"
        fi

        echo "version=${PW_VERSION}" >> $GITHUB_OUTPUT
        echo "--> Resolved Playwright version: ${PW_VERSION}"

    - name: Cache Playwright Browsers
      id: playwright-cache
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser }}-${{ inputs.only-shell }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ inputs.browser }}-
          ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-
          ${{ runner.os }}-playwright-

    - name: Verify & Provision Runtime Dependencies
      if: ${{ inputs.install-deps == 'true' }}
      shell: bash
      env:
        DEBIAN_FRONTEND: "noninteractive"
        NEEDRESTART_MODE: "a"
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          # Determine sudo usage for root vs non-root runner environments
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          # Auto-configure dpkg force-unsafe-io to eliminate fsync stalls on CoW/overlay filesystems
          if [ -d /etc/dpkg/dpkg.cfg.d ] && [ ! -f /etc/dpkg/dpkg.cfg.d/force-unsafe-io ]; then
            echo "force-unsafe-io" | ($SUDO tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io > /dev/null 2>&1 || tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io > /dev/null 2>&1 || true)
          fi

          # Check if all targeted headless Chromium runtime libraries are already satisfied
          REQUIRED_PKGS="libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libcups2t64 libdrm2 libgbm1 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libx11-xcb1 libxcb-dri3-0 fonts-liberation"
          if dpkg -s $REQUIRED_PKGS >/dev/null 2>&1; then
            echo "--> [OK] All targeted headless Chromium runtime dependencies already satisfied. Skipping apt-get."
            exit 0
          fi

          echo "--> [PROVISION] Installing targeted headless Chromium runtime libraries (~6 MB)..."
          $SUDO apt-get update -qq && $SUDO apt-get install -y --no-install-recommends $REQUIRED_PKGS
          echo "--> [DONE] Targeted runtime libraries installed successfully."
        else
          echo "--> OS is ${{ runner.os }}. Skipping Linux dependency provisioning."
        fi

    - name: Provision Playwright Browsers
      shell: bash
      run: |
        TARGET_BROWSER="${{ inputs.browser }}"
        PW_RUNNER="bunx playwright"
        if ! command -v bunx >/dev/null 2>&1 && command -v npx >/dev/null 2>&1; then
          PW_RUNNER="npx playwright"
        fi

        # 1. Check if running in container with /ms-playwright containing required browser revisions
        if [ -d "/ms-playwright" ]; then
          DRY_RUN_ARGS="$TARGET_BROWSER"
          if [ "$TARGET_BROWSER" = "chromium" ] && [ "${{ inputs.only-shell }}" = "true" ]; then
            DRY_RUN_ARGS="--only-shell chromium"
          fi

          MISSING_LOC=0
          EXPECTED_LOCS=$($PW_RUNNER install --dry-run $DRY_RUN_ARGS 2>/dev/null | awk '/Install location:/ {print $3}' || true)
          if [ -n "$EXPECTED_LOCS" ]; then
            for loc in $EXPECTED_LOCS; do
              if [ ! -d "$loc" ]; then
                echo "--> [CONTAINER PROBE] Required browser path missing in /ms-playwright: $loc"
                MISSING_LOC=1
                break
              fi
            done
            if [ "$MISSING_LOC" -eq 0 ]; then
              echo "--> [SSOT CONTAINER] All required Playwright browsers verified in /ms-playwright."
              echo "--> [OK] Skipping browser download entirely."
              exit 0
            else
              echo "--> [CONTAINER NOTICE] Container /ms-playwright exists but lacks required browser revision. Proceeding to targeted install."
            fi
          elif [ -n "$(ls -A /ms-playwright 2>/dev/null)" ]; then
            echo "--> [SSOT CONTAINER] Fallback: /ms-playwright is populated."
            exit 0
          fi
        fi

        # 2. Check if restored from cache
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          echo "--> [CACHE HIT] Playwright browser binaries restored from cache (~/.cache/ms-playwright)."
          echo "--> [OK] Skipping browser download."
          exit 0
        fi

        # 3. Perform targeted download
        if [ "$TARGET_BROWSER" = "all" ] || [ -z "$TARGET_BROWSER" ]; then
          echo "--> [DOWNLOAD] Installing all Playwright browsers..."
          $PW_RUNNER install
        elif [ "$TARGET_BROWSER" = "chromium" ] && [ "${{ inputs.only-shell }}" = "true" ]; then
          echo "--> [DOWNLOAD] Installing lightweight Chromium headless shell (~50 MB)..."
          $PW_RUNNER install --only-shell chromium
        else
          echo "--> [DOWNLOAD] Installing Playwright browser '${TARGET_BROWSER}'..."
          $PW_RUNNER install "${TARGET_BROWSER}"
        fi
