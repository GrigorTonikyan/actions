name: Actions & Image Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Actions & Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: builtin:checkout

      - name: Gitleaks Secret Scan
        uses: self:gt-dev/actions/gitleaks-scan@v1
        with:
          source: "."

      - name: Validate Action Manifests & SSoT Versions
        shell: bash
        run: bash ./scripts/validate-actions.sh

  ci-gate:
    name: PR Quality & Merge Gate
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Verify Quality Gate
        shell: bash
        run: echo "--> [OK] All actions and container validation checks passed successfully."
