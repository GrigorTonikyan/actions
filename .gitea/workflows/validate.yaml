name: Actions & Image Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Actions & Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Gitleaks Secret Scan
        uses: self:gt-dev/actions/gitleaks-scan@v1
        with:
          source: "."
          redact: "true"

      - name: Validate Action Manifests & SSoT Versions
        shell: bash
        run: bash ./scripts/validate-actions.sh

  ci-gate:
    name: PR Quality & Merge Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [validate]
    steps:
      - name: Verify Quality Gate
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "[FAIL] Actions validation job did not succeed (status: ${VALIDATE_RESULT})."
            exit 1
          fi
          echo "[PASS] All actions and container validation checks passed successfully."
