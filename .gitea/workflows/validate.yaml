name: Actions & Image Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Actions & Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Gitleaks Secret Scan
        uses: self:gt-dev/actions/gitleaks-scan@v1
        with:
          source: "."
          redact: "true"

      - name: Validate Action Manifests & SSoT Versions
        shell: bash
        run: bash ./scripts/validate-actions.sh

      - name: Setup Latest CDDM Binary
        uses: ./setup-cddm

      - name: Verify CDDM Architectural Rules
        shell: bash
        run: cddm rules check --rules .cddmrules.toml --enforce-policies

      - name: Run CDDM Duplication & Policy Scan
        shell: bash
        run: cddm scan . --no-ignore-tests --no-ignore-mocks --detect-type4 true --enforce-policies --fail-threshold 10.0

  ci-gate:
    name: PR Quality & Merge Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [validate]
    steps:
      - name: Verify Quality Gate
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "[FAIL] Actions validation job did not succeed (status: ${VALIDATE_RESULT})."
            exit 1
          fi
          echo "[PASS] All actions and container validation checks passed successfully."
