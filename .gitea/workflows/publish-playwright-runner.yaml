name: Publish Playwright Runner Image

on:
  push:
    branches: [main]
    paths:
      - "containers/playwright/**"
      - ".gitea/workflows/publish-playwright-runner.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Playwright Runner Container
    runs-on: highperf
    steps:
      - name: Checkout Code
        uses: builtin:checkout
        with:
          fetch-depth: 1

      - name: Resolve Playwright Version & Registry Tags
        id: meta
        shell: bash
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ ! -f "containers/playwright/PLAYWRIGHT_VERSION" ]; then
            echo "::error::containers/playwright/PLAYWRIGHT_VERSION not found!"
            exit 1
          fi
          if [ ! -f "containers/playwright/PLAYWRIGHT_DIGEST" ]; then
            echo "::error::containers/playwright/PLAYWRIGHT_DIGEST not found!"
            exit 1
          fi
          PW_VER="$(tr -d ' \r\n' < containers/playwright/PLAYWRIGHT_VERSION)"
          PW_DIGEST="$(tr -d ' \r\n' < containers/playwright/PLAYWRIGHT_DIGEST)"

          REGISTRY_HOST="${GITHUB_SERVER_URL#https://}"
          REGISTRY_HOST="${REGISTRY_HOST#http://}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          IMAGE_BASE="${REGISTRY_HOST}/${REPO_OWNER}/playwright-runner"

          echo "version=${PW_VER}" >> "$GITHUB_OUTPUT"
          echo "digest=${PW_DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF_TAGS"
            echo "${IMAGE_BASE}:latest"
            echo "${IMAGE_BASE}:v${PW_VER}"
            echo "${IMAGE_BASE}:${PW_VER}"
            echo "EOF_TAGS"
            echo "build-args<<EOF_ARGS"
            echo "PLAYWRIGHT_VERSION=${PW_VER}"
            echo "PLAYWRIGHT_IMAGE_DIGEST=${PW_DIGEST}"
            echo "EOF_ARGS"
          } >> "$GITHUB_OUTPUT"
          echo "[INFO] Resolved Playwright Container SSoT: ${PW_VER} (${PW_DIGEST})"

      - name: Validate Registry Credentials
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::Secret REGISTRY_TOKEN is not configured! Gitea Actions requires a personal access token with write:package scope."
            exit 1
          fi
          echo "[PASS] REGISTRY_TOKEN secret present."

      - name: Build and Push Playwright Runner Image
        id: publish
        uses: ./docker-build-push
        with:
          context: ./containers/playwright
          file: ./containers/playwright/Dockerfile
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.meta.outputs.build-args }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Report Published Digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          PW_VER: ${{ steps.meta.outputs.version }}
        run: |
          echo "[PASS] Playwright runner ${PW_VER} published (digest: ${IMAGE_DIGEST:-unknown})."
