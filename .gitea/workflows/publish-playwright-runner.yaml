name: Publish Playwright Runner Image

on:
  push:
    branches: [main]
    paths:
      - "containers/playwright/**"
      - ".gitea/workflows/publish-playwright-runner.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Playwright Runner Container
    runs-on: highperf
    steps:
      - name: Checkout Code
        uses: builtin:checkout

      - name: Resolve Playwright Version SSoT
        id: version
        shell: bash
        run: |
          if [ ! -f "containers/playwright/PLAYWRIGHT_VERSION" ]; then
            echo "::error::containers/playwright/PLAYWRIGHT_VERSION not found!"
            exit 1
          fi
          PW_VER=$(tr -d ' \r\n' < containers/playwright/PLAYWRIGHT_VERSION)
          echo "version=${PW_VER}" >> $GITHUB_OUTPUT
          echo "--> Resolved Playwright Container Version SSoT: ${PW_VER}"

      - name: Validate Registry Credentials
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::Secret REGISTRY_TOKEN is not configured! Gitea Actions requires a personal access token with write:package scope."
            exit 1
          fi
          echo "--> [OK] REGISTRY_TOKEN secret present."

      - name: Log in to Private Gitea Container Registry
        uses: self:gt-dev/actions/docker-login@v1
        with:
          registry: git.gt-web-dev.com
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build Playwright Runner Image
        shell: bash
        run: |
          echo "--> Building Playwright runner image for version ${{ steps.version.outputs.version }}..."
          docker build \
            --build-arg PLAYWRIGHT_VERSION=${{ steps.version.outputs.version }} \
            -t git.gt-web-dev.com/gt-dev/playwright-runner:latest \
            -t git.gt-web-dev.com/gt-dev/playwright-runner:v${{ steps.version.outputs.version }} \
            -t git.gt-web-dev.com/gt-dev/playwright-runner:${{ steps.version.outputs.version }} \
            ./containers/playwright

      - name: Push Playwright Runner Image
        shell: bash
        run: |
          echo "--> Pushing image tags to private container registry via local zero-trust loopback..."
          docker push git.gt-web-dev.com/gt-dev/playwright-runner:latest
          docker push git.gt-web-dev.com/gt-dev/playwright-runner:v${{ steps.version.outputs.version }}
          docker push git.gt-web-dev.com/gt-dev/playwright-runner:${{ steps.version.outputs.version }}
          echo "--> [SUCCESS] Playwright runner image published successfully."
