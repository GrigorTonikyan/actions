name: "Gitleaks Secret Scan"
description: "Pinned and verified Gitleaks secret scanner for Gitea Actions workflows"
inputs:
  version:
    description: "Gitleaks version to install"
    required: false
    default: "8.30.1"
  sha256:
    description: "Expected SHA256 checksum (optional verification)"
    required: false
    default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  redact:
    description: "Redact leaked secrets in output"
    required: false
    default: "true"
  source:
    description: "Target directory to scan"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install Pinned & Verified Gitleaks
      shell: bash
      run: |
        SUDO=""
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
          SUDO="sudo"
        fi
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.version }}/gitleaks_${{ inputs.version }}_linux_x64.tar.gz" -o gitleaks.tar.gz
        if [ -n "${{ inputs.sha256 }}" ]; then
          echo "${{ inputs.sha256 }}  gitleaks.tar.gz" | sha256sum -c -
        fi
        tar -xzf gitleaks.tar.gz gitleaks
        chmod +x gitleaks
        $SUDO mv gitleaks /usr/local/bin/gitleaks
        rm -f gitleaks.tar.gz
        gitleaks version

    - name: Execute Gitleaks Scan
      shell: bash
      run: |
        REDACT_FLAG=""
        if [ "${{ inputs.redact }}" = "true" ]; then
          REDACT_FLAG="--redact"
        fi
        gitleaks dir ${{ inputs.source }} $REDACT_FLAG -v
