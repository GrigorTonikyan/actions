name: "Gitleaks Secret Scan"
description: "Pinned and verified Gitleaks secret scanner for Gitea Actions workflows"
inputs:
  version:
    description: "Gitleaks version to install"
    required: false
    default: "8.24.0"
  redact:
    description: "Redact leaked secrets in output"
    required: false
    default: "true"
  source:
    description: "Target directory to scan"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install Pinned & Verified Gitleaks
      shell: bash
      run: |
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.version }}/gitleaks_${{ inputs.version }}_linux_x64.tar.gz" -o gitleaks.tar.gz
        tar -xzf gitleaks.tar.gz gitleaks
        chmod +x gitleaks
        sudo mv gitleaks /usr/local/bin/gitleaks
        rm -f gitleaks.tar.gz
        gitleaks version

    - name: Execute Gitleaks Scan
      shell: bash
      run: |
        REDACT_FLAG=""
        if [ "${{ inputs.redact }}" = "true" ]; then
          REDACT_FLAG="--redact"
        fi
        gitleaks dir ${{ inputs.source }} $REDACT_FLAG -v
