name: "Download Artifact"
description: "Zero-deprecation modern composite action for downloading Gitea Actions artifacts"
inputs:
  name:
    description: "Artifact name to download. If not specified, all artifacts will be downloaded."
    required: false
  path:
    description: "Destination path where the artifact should be downloaded"
    required: false
    default: "."
  merge-multiple:
    description: "Whether to merge multiple artifacts into the same directory when downloading all artifacts"
    required: false
    default: "false"

outputs:
  download-path:
    description: "Path where the artifact(s) were downloaded"
    value: ${{ steps.download-artifact.outputs.download-path }}

runs:
  using: "composite"
  steps:
    - name: Configure TLS CA Certificate Trust
      shell: bash
      run: |
        CA_BUNDLE="/tmp/runner-ca-bundle.crt"
        INTERNAL_CA="/etc/docker/certs.d/git.gt-web-dev.com/ca.crt"
        SYSTEM_CA="/etc/ssl/certs/ca-certificates.crt"
        PKI_CA="/etc/pki/tls/certs/ca-bundle.crt"

        if [ -f "$INTERNAL_CA" ]; then
          if [ -n "${NODE_EXTRA_CA_CERTS:-}" ] && [ -f "$NODE_EXTRA_CA_CERTS" ]; then
            cat "$NODE_EXTRA_CA_CERTS" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          elif [ -f "$SYSTEM_CA" ]; then
            cat "$SYSTEM_CA" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          elif [ -f "$PKI_CA" ]; then
            cat "$PKI_CA" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          else
            cp "$INTERNAL_CA" "$CA_BUNDLE" 2>/dev/null || true
          fi
          if [ -f "$CA_BUNDLE" ]; then
            echo "NODE_EXTRA_CA_CERTS=$CA_BUNDLE" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS with internal Gitea CA trust"
          fi
        elif [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
          if [ -f "$SYSTEM_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=$SYSTEM_CA" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=$SYSTEM_CA"
          elif [ -f "$PKI_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=$PKI_CA" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=$PKI_CA"
          fi
        fi

    - name: Download Artifact
      id: download-artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
