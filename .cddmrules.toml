# CDDM Architectural Rules & Policy Configuration for gt-dev/actions
# Enforces zero-emoji hygiene, banned legacy tooling, token budgets, and SSoT sync invariants.

zero_emojis = true

[[forbidden_files]]
name = "banned-legacy-tooling"
description = "Disallow legacy linters, foreign lockfiles, and .github workflow directories"
patterns = [
  ".eslintrc*",
  ".prettierrc*",
  "yarn.lock",
  "package-lock.json",
  "pnpm-lock.yaml",
  "bun.lockb",
  ".github/**"
]
severity = "error"
remediation = "Use .gitea/workflows/*.yaml, Vite+, and bun.lock per enterprise CI/CD standards"

[[prohibited_patterns]]
name = "no-tls-bypass-in-dockerfiles"
description = "Disallow NODE_TLS_REJECT_UNAUTHORIZED=0 or strict-ssl=false TLS bypasses in containers and examples"
pattern = "(NODE_TLS_REJECT_UNAUTHORIZED\\s*[:=]\\s*[\"']?0|strict-ssl\\s*=\\s*[\"']?false)"
pattern_type = "regex"
include = ["containers/**", "examples/**"]
severity = "error"
remediation = "Configure internal CA certificates via setup-tls-ca or BuildKit secret id=internal_ca"

[[token_budgets]]
name = "scripts-token-budget"
description = "Modular shell scripts must stay within <= 500 line / 2500 token budget"
pattern = "scripts/**/*.sh"
max_file_tokens = 2500
severity = "error"

[[token_budgets]]
name = "workflows-token-budget"
description = "Workflow manifests must stay concise and within token budgets"
pattern = ".gitea/workflows/*.yaml"
max_file_tokens = 2500
severity = "error"

[[token_budgets]]
name = "setup-cddm-token-budget"
description = "setup-cddm composite action must remain modular and within token budgets"
pattern = "setup-cddm/action.yaml"
max_file_tokens = 2500
severity = "error"

[[token_budgets]]
name = "examples-token-budget"
description = "Reference example templates must remain concise and readable"
pattern = "examples/**/*"
max_file_tokens = 2500
severity = "error"

[[token_budgets]]
name = "containers-token-budget"
description = "Container image definitions must remain concise and readable"
pattern = "containers/**/*"
max_file_tokens = 2500
severity = "error"

[[sync_rules]]
name = "playwright-version-container-sync"
description = "Ensure Playwright container SSoT version matches Dockerfiles and runner-toolchains VERSIONS"
source_file = "containers/playwright/PLAYWRIGHT_VERSION"
source_regex = '^([0-9]+\.[0-9]+\.[0-9]+)$'
target_files = [
  "containers/playwright/Dockerfile",
  "containers/runner-toolchains/VERSIONS"
]
target_regex = 'PLAYWRIGHT_VERSION=([0-9]+\.[0-9]+\.[0-9]+)'
severity = "error"
remediation = "Synchronize PLAYWRIGHT_VERSION across containers/playwright/ and containers/runner-toolchains/VERSIONS"

[[sync_rules]]
name = "playwright-example-ci-sync"
description = "Ensure examples/nextjs CI workflow uses the SSoT playwright-runner tag"
source_file = "containers/playwright/PLAYWRIGHT_VERSION"
source_regex = '^([0-9]+\.[0-9]+\.[0-9]+)$'
target_files = ["examples/nextjs/.gitea/workflows/ci.yaml"]
target_regex = 'playwright-runner:v([0-9]+\.[0-9]+\.[0-9]+)'
severity = "error"
remediation = "Update playwright-runner image tag in examples/nextjs/.gitea/workflows/ci.yaml"

[[sync_rules]]
name = "node26-alpine-digest-sync"
description = "Ensure examples/nextjs/Dockerfile pins the SSoT Active LTS NODE26_IMAGE digest"
source_file = "containers/bun-node-alpine/VERSIONS"
source_regex = '^NODE26_IMAGE=(node:26-alpine@sha256:[0-9a-f]{64})$'
target_files = ["examples/nextjs/Dockerfile"]
target_regex = '(node:26-alpine@sha256:[0-9a-f]{64})'
severity = "error"
remediation = "Update Node 26 Alpine digest in examples/nextjs/Dockerfile to match containers/bun-node-alpine/VERSIONS"
