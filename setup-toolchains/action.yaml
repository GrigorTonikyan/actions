name: "Setup Forge Workspace Toolchains"
description: "Unified composite action for Bun (with pre-baked container fast-path), Python, uv, TLS CA trust, and dependency/Next.js caching in Gitea Actions"
inputs:
  bun:
    description: "Install and configure Bun environment"
    required: false
    default: "true"
  bun-version:
    description: "Bun version to install"
    required: false
    default: "latest"
  uv:
    description: "Install and configure Astral uv"
    required: false
    default: "false"
  uv-version:
    description: "Astral uv version to install (leave empty for latest or pyproject.toml / uv.toml pinned version)"
    required: false
    default: ""
  python-version:
    description: "Python version to install (if uv/python requested)"
    required: false
    default: "3.13"
  cache:
    description: "Enable dependency caching"
    required: false
    default: "true"
  nextjs-cache:
    description: "Enable Next.js build cache (.next/cache) caching across CI/E2E runs"
    required: false
    default: "false"
  nextjs-cache-path:
    description: "Path to the Next.js build cache directory"
    required: false
    default: ".next/cache"
  nextjs-cache-key-suffix:
    description: "Optional extra suffix appended to the Next.js cache key"
    required: false
    default: ""
  configure-tls-ca:
    description: "Configure NODE_EXTRA_CA_CERTS, SSL_CERT_FILE, and CURL_CA_BUNDLE from runner/internal CA certificates"
    required: false
    default: "true"

outputs:
  bun-version:
    description: "Resolved Bun version active in PATH"
    value: ${{ steps.detect-bun.outputs.skip == 'true' && steps.detect-bun.outputs.version || steps.setup-bun.outputs.bun-version }}
  bun-skipped:
    description: "Whether oven-sh/setup-bun was skipped due to pre-installed Bun detection"
    value: ${{ steps.detect-bun.outputs.skip }}

runs:
  using: "composite"
  steps:
    # Note: replace with self:gt-dev/actions/setup-tls-ca@v1 once gt-dev/actions#31 lands.
    - name: Configure Internal Loopback TLS CA Trust
      if: ${{ inputs.configure-tls-ca == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        SERVER_HOST="${GITHUB_SERVER_URL:-}"
        SERVER_HOST="${SERVER_HOST#https://}"
        SERVER_HOST="${SERVER_HOST#http://}"
        SERVER_HOST="${SERVER_HOST%%/*}"

        INTERNAL_CA=""
        if [ -n "$SERVER_HOST" ] && [ -f "/etc/docker/certs.d/${SERVER_HOST}/ca.crt" ]; then
          INTERNAL_CA="/etc/docker/certs.d/${SERVER_HOST}/ca.crt"
        fi

        SYSTEM_CA="/etc/ssl/certs/ca-certificates.crt"
        PKI_CA="/etc/pki/tls/certs/ca-bundle.crt"

        if [ -n "$INTERNAL_CA" ] && [ -f "$INTERNAL_CA" ]; then
          CA_BUNDLE="$(mktemp "${RUNNER_TEMP:-/tmp}/runner-ca-bundle.XXXXXX.crt")"
          if [ -n "${NODE_EXTRA_CA_CERTS:-}" ] && [ -f "$NODE_EXTRA_CA_CERTS" ]; then
            cat "$NODE_EXTRA_CA_CERTS" "$INTERNAL_CA" > "$CA_BUNDLE"
          elif [ -f "$SYSTEM_CA" ]; then
            cat "$SYSTEM_CA" "$INTERNAL_CA" > "$CA_BUNDLE"
          elif [ -f "$PKI_CA" ]; then
            cat "$PKI_CA" "$INTERNAL_CA" > "$CA_BUNDLE"
          else
            cp "$INTERNAL_CA" "$CA_BUNDLE"
          fi
          chmod 0644 "$CA_BUNDLE"
          echo "NODE_EXTRA_CA_CERTS=${CA_BUNDLE}" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=${CA_BUNDLE}" >> "$GITHUB_ENV"
          echo "CURL_CA_BUNDLE=${CA_BUNDLE}" >> "$GITHUB_ENV"
          echo "--> [TLS] Configured CA trust bundle with internal CA for ${SERVER_HOST}"
        elif [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
          if [ -f "$SYSTEM_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=${SYSTEM_CA}" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=${SYSTEM_CA}"
          elif [ -f "$PKI_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=${PKI_CA}" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=${PKI_CA}"
          fi
        fi

    - name: Detect Pre-Installed Bun Runtime
      id: detect-bun
      if: ${{ inputs.bun == 'true' }}
      shell: bash
      env:
        INPUT_BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        BUN_BIN=""
        if command -v bun >/dev/null 2>&1; then
          BUN_BIN="$(command -v bun)"
        else
          for candidate in /opt/bun/bin/bun /usr/local/bin/bun "${HOME}/.bun/bin/bun"; do
            if [ -x "$candidate" ]; then
              BUN_BIN="$candidate"
              BIN_DIR="$(dirname "$candidate")"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              export PATH="${BIN_DIR}:${PATH}"
              break
            fi
          done
        fi

        if [ -n "$BUN_BIN" ]; then
          INSTALLED_VER="$(bun --version 2>/dev/null | tr -d ' \r\n' || true)"
          REQ="${INPUT_BUN_VERSION:-latest}"
          REQ_CLEAN="${REQ#v}"
          if [ -n "$INSTALLED_VER" ]; then
            MATCH="false"
            if [ "$REQ_CLEAN" = "latest" ] || [ -z "$REQ_CLEAN" ] || [ "$INSTALLED_VER" = "$REQ_CLEAN" ]; then
              MATCH="true"
            else
              case "$INSTALLED_VER" in
                "${REQ_CLEAN}".*)
                  MATCH="true"
                  ;;
              esac
            fi
            if [ "$MATCH" = "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "version=${INSTALLED_VER}" >> "$GITHUB_OUTPUT"
              echo "--> [FAST-PATH] Pre-installed Bun ${INSTALLED_VER} detected at ${BUN_BIN}; skipping setup-bun download."
              exit 0
            fi
            echo "--> [INFO] Pre-installed Bun ${INSTALLED_VER} does not match requested '${REQ_CLEAN}'; running setup-bun."
          fi
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "version=" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: ${{ inputs.uv == 'true' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Astral uv
      if: ${{ inputs.uv == 'true' }}
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: ${{ inputs.cache == 'true' }}

    - name: Set up Bun
      id: setup-bun
      if: ${{ inputs.bun == 'true' && steps.detect-bun.outputs.skip != 'true' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun Dependencies
      if: ${{ inputs.bun == 'true' && inputs.cache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache Next.js Build Output
      if: ${{ inputs.nextjs-cache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ inputs.nextjs-cache-path }}
        key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock', 'bun.lockb', 'package-lock.json', 'package.json') }}-${{ hashFiles('next.config.*', 'src/**') }}${{ inputs.nextjs-cache-key-suffix != '' && format('-{0}', inputs.nextjs-cache-key-suffix) || '' }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock', 'bun.lockb', 'package-lock.json', 'package.json') }}-
          ${{ runner.os }}-nextjs-
