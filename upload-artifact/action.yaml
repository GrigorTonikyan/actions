name: "Upload Artifact"
description: "Zero-deprecation modern composite action for uploading Gitea Actions artifacts"
inputs:
  name:
    description: "Artifact name to upload"
    required: false
    default: "artifact"
  path:
    description: "File, directory, or wildcard pattern to upload"
    required: true
  if-no-files-found:
    description: "Behavior when no files are found (warn, error, ignore)"
    required: false
    default: "warn"
  retention-days:
    description: "Duration in days after which artifact expires"
    required: false
    default: "90"
  compression-level:
    description: "Zlib compression level (0-9)"
    required: false
    default: "6"
  overwrite:
    description: "Whether to overwrite existing artifact with same name"
    required: false
    default: "false"

outputs:
  artifact-id:
    description: "A unique identifier for the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
  artifact-url:
    description: "A download URL to the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-url }}
  artifact-digest:
    description: "The SHA256 digest of the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-digest }}

runs:
  using: "composite"
  steps:
    - name: Configure TLS CA Certificate Trust
      shell: bash
      run: |
        CA_BUNDLE="/tmp/runner-ca-bundle.crt"
        INTERNAL_CA="/etc/docker/certs.d/git.gt-web-dev.com/ca.crt"
        SYSTEM_CA="/etc/ssl/certs/ca-certificates.crt"
        PKI_CA="/etc/pki/tls/certs/ca-bundle.crt"

        if [ -f "$INTERNAL_CA" ]; then
          if [ -n "${NODE_EXTRA_CA_CERTS:-}" ] && [ -f "$NODE_EXTRA_CA_CERTS" ]; then
            cat "$NODE_EXTRA_CA_CERTS" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          elif [ -f "$SYSTEM_CA" ]; then
            cat "$SYSTEM_CA" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          elif [ -f "$PKI_CA" ]; then
            cat "$PKI_CA" "$INTERNAL_CA" > "$CA_BUNDLE" 2>/dev/null || true
          else
            cp "$INTERNAL_CA" "$CA_BUNDLE" 2>/dev/null || true
          fi
          if [ -f "$CA_BUNDLE" ]; then
            echo "NODE_EXTRA_CA_CERTS=$CA_BUNDLE" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS with internal Gitea CA trust"
          fi
        elif [ -z "${NODE_EXTRA_CA_CERTS:-}" ]; then
          if [ -f "$SYSTEM_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=$SYSTEM_CA" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=$SYSTEM_CA"
          elif [ -f "$PKI_CA" ]; then
            echo "NODE_EXTRA_CA_CERTS=$PKI_CA" >> "$GITHUB_ENV"
            echo "--> [TLS] Configured NODE_EXTRA_CA_CERTS=$PKI_CA"
          fi
        fi

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
