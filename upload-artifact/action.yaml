name: "Upload Artifact"
description: "Zero-deprecation modern composite action for uploading Gitea Actions artifacts"
inputs:
  name:
    description: "Artifact name to upload"
    required: false
    default: "artifact"
  path:
    description: "File, directory, or wildcard pattern to upload"
    required: true
  if-no-files-found:
    description: "Behavior when no files are found (warn, error, ignore)"
    required: false
    default: "warn"
  retention-days:
    description: "Duration in days after which artifact expires"
    required: false
    default: "90"
  compression-level:
    description: "Zlib compression level (0-9)"
    required: false
    default: "6"
  overwrite:
    description: "Whether to overwrite existing artifact with same name"
    required: false
    default: "false"

outputs:
  artifact-id:
    description: "A unique identifier for the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
  artifact-url:
    description: "A download URL to the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-url }}
  artifact-digest:
    description: "The SHA256 digest of the uploaded artifact"
    value: ${{ steps.upload-artifact.outputs.artifact-digest }}

runs:
  using: "composite"
  steps:
    - name: Configure TLS CA Certificate Trust
      uses: self:gt-dev/actions/setup-tls-ca@v1

    - name: Upload Artifact
      id: upload-artifact
      # Intentionally pinned to v4.x for Gitea Actions Artifact v1 API compatibility
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
